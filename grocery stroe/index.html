    <link rel="stylesheet" href="style.css">

    <title>Document</title>
</head>

<body>
    <header class="d-flex flex-column justify-content-center align-items-center w-100">
        <nav class="navbar01 w-100">
            <a href="#"><i class="fa-solid fa-truck"></i>Delivery on Next Day from 10:00 AM to 08:00 PM</a>
            <div class=" navbar01-col d-flex gap-4">
                <a href="#">Home</i></a>
                <a href="#">About Us</i></a>
                <a href="#">Contacts</i></a>
                <a href="#">FAQ</i></a>
            </div>
            <div class=" navbar01-col d-flex gap-4">
                <a href="#"><i class="fa-solid fa-phone-volume"></i>+91 96854 69548</a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="#"><i class="fa-brands fa-square-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </nav>
        <nav class="navbar02 d-flex justify-content-between">
            <a href=""><img src="assets/tastydaily-0556409248.png" alt="MealToCart.com" style="width: 200px;"></a>
            <div class="navbar02-col d-flex justify-content-between gap-5 text-center">
                <div class="icon-name">
                    <i class="fi fi-br-store-alt"></i>
                    <p><span>Shop</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-broccoli"></i>
                    <p><span>Vegetalbes</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-cherry"></i>
                    <p><span>Fresh Fruits</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-meat"></i>
                    <p><span>Meat</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-fish"></i>
                    <p><span>Sea Food</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-pie"></i>
                    <p><span>Baking</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-hamburger-soda"></i>
                    <p><span>Drinks</span></p>
                </div>
                <div class="icon-name">
                    <i class="fi fi-br-circle-ellipsis"></i>
                    <p><span>Others</span></p>
                </div>
            </div>
            <div class=" navbar02-col">
                <a href="#"><i class="fi fi-br-search"></i></a>
                <a href="#"><i class="fi fi-br-user"></i></a>
                <a href="#"><i class="fi fi-br-heart"></i></a>
                <a href="#"><i class="fi fi-br-shopping-cart-add"></i></i></a>
            </div>
        </nav>
    </header>

    <section> 
        <div id="carouselExampleIndicators" class="carousel slide carousel-fade" data-ride="true">
            <ol class="carousel-indicators">
              <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
              <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
              <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
            </ol>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img class="d-block w-100" src="assets/replace.png" alt="First slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="assets/tastydaily-1407930036.png" alt="Second slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="assets/tastydaily-1407368539.png" alt="Third slide">
              </div>
            </div>
            <a class="carousel-control-prev text-decoration-none" href="#carouselExampleIndicators" role="button" data-slide="prev">
              <span class="fi fi-br-arrow-left fs-1" aria-hidden="true"></span>
              <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next text-decoration-none" href="#carouselExampleIndicators" role="button" data-slide="next">
              <span class="fi fi-br-arrow-right fs-1" aria-hidden="true"></span>
              <span class="sr-only">Next</span>
            </a>
          </div>
    </section>

    <section style="height: 100vh;"></section>
